name: CI

# Three things can go wrong in this repo, and all three are cheap to catch:
# a script breaks on one of the two bash versions it has to support, a secret
# lands in git, or a personal file gets staged for a public ClawHub upload.
# Everything below exists for one of those.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # setup.sh targets bash 3.2 on macOS and bash 5 on Linux. /bin/bash on
        # these two runners is exactly that pair, so parsing under both is the
        # real compatibility gate, not a stand-in for it.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Parse under this runner's /bin/bash
        run: /bin/bash -n scripts/*.sh scripts/tests/*.sh scripts/hooks/* skill/postflight/*.sh

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck -S style scripts/*.sh scripts/tests/*.sh scripts/hooks/* skill/postflight/*.sh

      # The scripts here that move data the user cannot recreate, so they are
      # the ones with tests. Both run on both platforms: they lean on find,
      # comm, rsync, and cp -R, which differ between BSD and GNU.
      - name: State relocation fixture
        run: ./scripts/tests/relocate-fixture.sh

      - name: Install chain fixture
        run: ./scripts/tests/install-fixture.sh

      # A skill doc still naming {baseDir}/state tells the agent to write into
      # the folder the next upgrade deletes. git ls-files scopes this to what
      # actually ships — the user's own *.local.md files are untracked.
      - name: No skill doc points at the pre-v1.2.0 state paths
        if: runner.os == 'Linux'
        run: |
          if git ls-files skill/ | xargs grep -ln \
               -e '{baseDir}/state' \
               -e '{baseDir}/pillars.local.md' \
               -e '{baseDir}/voice-examples.local.md'; then
            echo "::error::the files above still point at the pre-v1.2.0 state paths"
            exit 1
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the tip. A token committed and
          # reverted is still a leaked token.
          fetch-depth: 0

      # Pinned and checksummed for the same reason setup.sh pins xurl: "latest"
      # is a mutable pointer, and this binary reads every secret in the history.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tmp="$(mktemp -d)"
          curl -fsSL "$base/$asset" -o "$tmp/$asset"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$tmp/checksums.txt"
          (cd "$tmp" && grep " $asset\$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$asset" -C "$tmp" gitleaks
          sudo install "$tmp/gitleaks" /usr/local/bin/gitleaks

      # --redact matters on a public repo: without it a hit prints the secret
      # into a world-readable build log, which is worse than the commit.
      - name: Scan history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  publish-guard:
    name: ClawHub publish guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The dry run stages the skill exactly as a real publish would and dies
      # on anything personal. Running it here means the guarantee is tested on
      # every PR instead of only on the day someone publishes.
      - name: Stage the skill and diff against the manifest
        run: ./scripts/publish-clawhub.sh 0.0.0

  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --offline checks relative and file links only. External links rot on
      # someone else's schedule; a red build nobody can fix teaches people to
      # ignore red builds.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "**/*.md" "site/*.html"
          fail: true
