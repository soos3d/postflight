name: Deploy landing page

# Publishes site/ to GitHub Pages. Nothing in docs/*.md is rendered: the
# artifact is staged here rather than served from a branch, so the markdown
# docs stay markdown and only site/ plus the shared assets go up.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that's already publishing; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # Shared images (social card, approval-flow demo) live in docs/assets
          # so the README and the site reference one copy.
          mkdir -p _site/assets
          cp -r docs/assets/. _site/assets/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
